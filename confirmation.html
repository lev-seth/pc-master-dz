<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تم تأكيد طلبك بنجاح — رقم الطلب وتفاصيل التوصيل من PC Master DZ.">
  <title>تأكيد الطلب | PC Master DZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="confirmation">

  <header data-site-header></header>

  <main class="container">
    <div id="confirm-root">
      <div class="confirm-wrap">
        <div class="empty-state">
          <h3>جاري التحقق من الطلب...</h3>
        </div>
      </div>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script src="js/data.js?v=4"></script>
  <script>
    /* انتظار اكتمال تحميل الكتالوج من الـ API قبل تشغيل بقية السكربتات
       (نفس نمط بقية الصفحات حتى تعمل المكتبات بعد جلب البيانات) */
    window.CATALOG_READY.then(function () {
      var scripts = ['js/store.js?v=4', 'js/confirmation.js?v=4'];
      var loaded = 0;
      scripts.forEach(function (src) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = function () {
          loaded++;
          /* بعد تحميل السكربتين معاً، نُطلق حدث الجاهزية */
          if (loaded === scripts.length) {
            window.dispatchEvent(new Event('frontend:ready'));
          }
        };
        document.body.appendChild(s);
      });
    });
  </script>
</body>
</html>
